name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
    # A push of the records alone (ROADMAP, PROGRESS, DECISIONS and the other Markdown, docs/, the critic's reports)
    # changes nothing on the site, so it builds and deploys nothing (ADR-1155). A push with any other file deploys.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'critic/**'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # The deploy waits on typecheck and lint (ADR-1155): a commit that breaks either is not published. The unit suite
  # (about an hour on a runner) stays in the nightly run. In parallel with the build, so the deploy is no later.
  check:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The evidence and the critic's reports (about 490 MB) are read by neither (ADR-1155).
          sparse-checkout: |
            /*
            !/docs/evidence/
            !/critic/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The site is built from src/, public/ and data/: not from the evidence or the critic's reports (ADR-1155).
          sparse-checkout: |
            /*
            !/docs/evidence/
            !/critic/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # The historical replay's yearly starts (ROADMAP R68a, ADR-983): built here, never committed. ~18 min, so
      # cached on every input the sim reads; a push that changes none of them reuses the last build. A missed
      # input would not pass silently: the game throws on a start whose hash is not the world built.
      - id: saves-cache
        uses: actions/cache@v4
        with:
          path: dist/data/scenarios/1938h/start
          key: replay-saves-${{ hashFiles('src/sim/**', 'src/shared/**', 'data/**', 'public/data/**', 'tools/data/**', 'tools/headless/**', 'tests/helpers/**', 'package.json', 'package-lock.json', 'tsconfig*.json') }}
      - if: steps.saves-cache.outputs.cache-hit != 'true'
        run: npm run saves -- dist/data/scenarios/1938h/start
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: [check, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
